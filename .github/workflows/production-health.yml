name: Santé après déploiement

on:
  deployment_status:
  # La sonde ne dépend plus du seul deployment_status : un incident SANS
  # déploiement (worker mort, base dégradée) était invisible jusqu'au commit
  # suivant. Toutes les 20 minutes, mêmes vérifications, même verdict (JOB-5).
  schedule:
    - cron: "*/20 * * * *"

permissions:
  contents: read

jobs:
  production-health:
    name: Base · Workers · Sécurité
    if: >-
      github.event_name == 'schedule' ||
      (github.event.deployment_status.state == 'success' &&
      (github.event.deployment.environment == 'Production' ||
      github.event.deployment.environment == 'production'))
    runs-on: ubuntu-latest
    concurrency:
      group: production-health
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Healthcheck bloquant
        env:
          # Un run planifié n'a pas d'événement de déploiement : repli sur le
          # domaine de production stable.
          PRODUCTION_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url || 'https://lastchance-mu.vercel.app' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/verify-production-health.mjs
