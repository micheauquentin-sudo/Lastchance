name: CI

on:
  push:
    branches: [main]
  pull_request:
  # RELANCE MANUELLE — pour le jour où le déclencheur ne part pas.
  #
  # Le 2026-08-06, aucun run n'a démarré pendant plus de cinq heures, toutes
  # branches et tous événements confondus : quatre commits sont partis en
  # production sans CI. Actions était pourtant activé, ce workflow actif, le
  # dépôt public (donc sans plafond de minutes) et le déclencheur intact — la
  # file d'attente GitHub ne prenait simplement plus les événements. Ce piège
  # est déjà consigné trois fois dans les notes du projet sous la forme
  # « vérifier le headSha du run, pas la pastille verte ».
  #
  # Sans cette entrée, la seule façon de relancer la CI sur un `main` déjà
  # poussé était un commit vide — un artefact dans l'historique pour un
  # problème d'infrastructure. `gh workflow run ci.yml --ref main` suffit.
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau push annule les runs CI encore en cours SUR LA MÊME PR — c'est là
# qu'on empile des runs redondants (3 pushes rapides = 3 CI complètes). On
# n'annule PAS sur `main` : un run poussé sur main va jusqu'au bout, l'historique
# de statut reste complet. cancel-in-progress est sûr ici — la CI ne déploie
# rien et ne mute aucun état partagé (Supabase/Playwright tournent sur des
# runners jetables).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Typecheck · Lint · Tests · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installation reproductible (lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Dette TypeScript — aucun nouveau double cast non justifié
        run: |
          npm run casts:check
          npm run test:casts

      - name: Lint
        run: npm run lint

      # Le build tourne sans secrets : la config (Sentry, CSP) a des
      # fallbacks prévus pour un environnement CI autonome.
      #
      # AVANT les tests, délibérément : « ne prérend aucune route porteuse de
      # nonce » (src/lib/security-headers.test.ts) inspecte .next/server/app et
      # se neutralise poliment quand aucun build n'existe — pour rester
      # lançable seul en local. Tant que ce step suivait `npm test`, ce filet
      # était donc vert sans jamais rien vérifier en CI, alors qu'il garde une
      # panne totale : une route classée `sensitive` mais prérendue reçoit
      # `'strict-dynamic'` sans nonce, et plus aucun script ne s'exécute.
      - name: Build de production
        run: npm run build

      - name: Tests unitaires
        run: npm test

  site:
    name: Site vitrine · Typecheck · Lint · Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Installation reproductible (lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build statique
        run: npm run build

  audit:
    name: npm audit (vulnérabilités)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Échoue dès qu'une vulnérabilité de sévérité modérée ou plus est
      # publiée pour une dépendance du lockfile (prod comme dev).
      - name: Audit des dépendances
        run: npm audit --audit-level=moderate

      - name: Audit des dépendances (site vitrine)
        working-directory: site
        run: npm audit --audit-level=moderate

  database-security:
    name: PostgreSQL · ACL · RLS · Intégrité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Tests du garde d'ordre des migrations
        run: npm run test:migrations

      # La sonde de santé post-déploiement a son propre test, qui ne tournait
      # nulle part : une régression du script ne se voyait qu'en production,
      # au premier incident (CI-2).
      - name: Test de la sonde de santé
        run: npm run test:production-health

      # COALESCE/GREATEST/LEAST/NULLIF sont des constructions du parseur, sans
      # entrée pg_proc : les qualifier en `pg_catalog.` passe l'application de
      # la migration et casse au premier appel réel. Contrôle statique, donc
      # placé avant `supabase start` : il échoue en secondes, sans Docker.
      - name: Constructions du parseur non qualifiables
        run: |
          npm run test:sql
          npm run sql:check

      # Une PR est comparée au SHA de sa branche de base ; un push à son
      # ancien head. Le checkout complet rend ces deux commits disponibles.
      # Le SHA nul n'existe que pour le premier push d'une nouvelle ref.
      - name: Ordre et immutabilité des migrations
        env:
          MIGRATION_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$MIGRATION_BASE_REF" || "$MIGRATION_BASE_REF" =~ ^0+$ ]]; then
            npm run migrations:check
          else
            npm run migrations:check -- --base "$MIGRATION_BASE_REF"
          fi

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Démarrer Supabase et appliquer toutes les migrations
        run: supabase start

      # Le seed est chargé AVANT pgTAP, délibérément. La suite tournait
      # jusqu'ici sur une base vide, et cinq assertions en dépendaient sans le
      # dire : elles comptaient globalement (`count(*) from participations`)
      # ou partageaient par hasard un `player_key` avec une fixture E2E du
      # seed. Toutes passaient en CI et TOUTES échouaient dès qu'un
      # développeur semait sa base locale — un vert qui ne tenait qu'à l'ordre
      # des jobs. Semer ici transforme « la suite est indépendante des données
      # préexistantes » d'accident en propriété vérifiée à chaque passage.
      - name: Semer la base (les tests doivent tenir sur une base peuplée)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/seed.sql

      - name: Audit pgTAP des ACL et politiques réelles
        run: supabase test db supabase/tests/campaign_creation.test.sql supabase/tests/reward_backfill.test.sql supabase/tests/reward_retention.test.sql supabase/tests/spin_grant_bounds.test.sql supabase/tests/storage_acl.test.sql supabase/tests/search_path_invariant.test.sql supabase/tests/security_acl.test.sql supabase/tests/contest_leaderboard.test.sql supabase/tests/jobs_queue.test.sql supabase/tests/ops_monitoring.test.sql supabase/tests/prize_lifecycle.test.sql supabase/tests/universal_rewards.test.sql supabase/tests/automation.test.sql supabase/tests/hunts.test.sql supabase/tests/loyalty.test.sql supabase/tests/jackpot.test.sql supabase/tests/events.test.sql supabase/tests/calendar.test.sql supabase/tests/referral.test.sql supabase/tests/quick_games_skill.test.sql supabase/tests/generic_contests.test.sql supabase/tests/campaign_templates.test.sql supabase/tests/quizzes.test.sql supabase/tests/contest_awards.test.sql supabase/tests/subscription_entitlements.test.sql supabase/tests/player_identity.test.sql supabase/tests/experience_analytics.test.sql supabase/tests/meta_progression.test.sql supabase/tests/hunt_settlement_and_member_role.test.sql supabase/tests/hunt_settlement_preview.test.sql supabase/tests/calendar_progress_resync.test.sql supabase/tests/weekly_digest.test.sql supabase/tests/player_wallet.test.sql supabase/tests/sms_foundation.test.sql supabase/tests/sms_sender_identity.test.sql supabase/tests/sms_credit_ledger.test.sql supabase/tests/sms_e164_and_send_gate.test.sql supabase/tests/sms_segments.test.sql supabase/tests/sms_findings.test.sql supabase/tests/sms_sanction.test.sql supabase/tests/worker_vault_write.test.sql supabase/tests/reward_details_freeze.test.sql supabase/tests/reward_source_deletion.test.sql supabase/tests/reward_expiry_days.test.sql supabase/tests/access_parity.test.sql supabase/tests/publication_guards.test.sql supabase/tests/module_grants.test.sql supabase/tests/module_grant_payment.test.sql supabase/tests/module_grant_activation.test.sql supabase/tests/module_grant_recurring.test.sql supabase/tests/module_page_opens.test.sql supabase/tests/module_page_opens_hunts.test.sql supabase/tests/animation_center_counts.test.sql supabase/tests/loyalty_order_codes.test.sql supabase/tests/loyalty_order_codes_hygiene.test.sql supabase/tests/themes_saisonniers.test.sql supabase/tests/qr_hub.test.sql supabase/tests/customer_profiles_page.test.sql supabase/tests/sorties_rgpd.test.sql supabase/tests/droits_stripe.test.sql supabase/tests/boucle_joueur_gain.test.sql supabase/tests/index_fk_couverture.test.sql supabase/tests/soiree_live.test.sql supabase/tests/fk_composites_couverture.test.sql supabase/tests/reserver.test.sql

      # Garde anti-dérive : le snapshot commité src/types/database.generated.ts
      # (produit par `npm run types:generate`) doit refléter les migrations.
      # On régénère ici via scripts/generate-db-types.mjs en mode --local
      # (Supabase démarré ci-dessus). Le script normalise la sortie —
      # suppression du bloc __InternalSupabase (version PostgREST du serveur,
      # pas le schéma), UTF-8 LF sans BOM, newline finale unique — donc la
      # comparaison est un diff byte à byte, sans exclusion -I.
      - name: Types TypeScript — dérive schéma vs snapshot
        id: types-drift
        run: |
          node scripts/generate-db-types.mjs --local
          if ! git diff --exit-code -- src/types/database.generated.ts; then
            echo "::error::src/types/database.generated.ts a dérivé du schéma — récupérez l'artefact 'database-generated-types' de ce job et commitez-le, ou lancez 'npm run types:generate' si vous disposez de Docker."
            exit 1
          fi

      # Filet de réparation. La machine de développement peut désormais
      # régénérer ce fichier elle-même (Docker tourne nativement dans WSL2
      # depuis le 2026-07-28 — l'ancienne impasse « Docker Desktop exige un
      # build Windows ≥ 19045 » ne s'applique plus), mais avec une nuance à
      # connaître : `npm run types:generate` interroge la PRODUCTION
      # (`--linked`), où les migrations de la branche ne sont pas encore
      # appliquées ; il faut `node scripts/generate-db-types.mjs --local`,
      # comme ci-dessus. Sans cette publication, la garde régénère le bon
      # fichier, le compare, puis le jette.
      - name: Snapshot de types régénéré (artefact de réparation)
        if: failure() && steps.types-drift.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: database-generated-types
          path: src/types/database.generated.ts
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: E2E Playwright (Chromium · WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installation reproductible (lockfile)
        run: npm ci

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Démarrer Supabase (migrations appliquées)
        run: supabase start

      - name: Seed E2E déterministe
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/seed.sql

      - name: Environnement de l'app (clés du Supabase local + secrets factices)
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
            echo "SPIN_TOKEN_SECRET=$(openssl rand -hex 32)"
            echo "CLAIM_TOKEN_SECRET=$(openssl rand -hex 32)"
            echo "PLAYER_KEY_SALT=$(openssl rand -hex 32)"
            echo "UNSUBSCRIBE_TOKEN_SECRET=$(openssl rand -hex 32)"
            echo "TEAM_INVITE_TOKEN_SECRET=$(openssl rand -hex 32)"
            echo "CRON_SECRET=$(openssl rand -hex 16)"
            # next start force NODE_ENV=production : sans cette variable,
            # l'anti-robot devient obligatoire, les spins sont bloqués et
            # /api/health répond 503 (configuration de sécurité incomplète).
            echo "TURNSTILE_REQUIRED=false"
            # ATTENDU : /api/health reste malgré tout `unhealthy` ici, et le
            # diagnostic plus bas le dira — « IP client non mesurable » (I1).
            # C'est EXACT : ce banc n'a ni TRUSTED_PROXY_PROVIDER ni VERCEL,
            # donc ses plafonds par IP sont bien désarmés. On ne déclare PAS de
            # proxy pour faire taire la sonde : `generic` ferait confiance aux
            # en-têtes forgeables du proxy TLS local et ferait diverger le
            # comportement E2E de celui de la production (`vercel`). Aucune
            # étape ne dépend de ce verdict — le curl est en `|| true`.
            # Stripe : clé factice (le webhook instancie le client pour
            # vérifier la signature) + secret partagé avec les specs +
            # API détournée vers le stub local (e2e/api-stubs.mjs).
            echo "STRIPE_SECRET_KEY=sk_test_$(openssl rand -hex 12)"
            echo "STRIPE_WEBHOOK_SECRET=whsec_$(openssl rand -hex 24)"
            echo "STRIPE_API_BASE=http://127.0.0.1:12111"
            # Prix de l'offre Engagement : le webhook refuse (500, pour que
            # Stripe retente) tout prix absent de la configuration — les
            # abonnements du stub doivent donc en porter un connu. Volontaire-
            # ment PAS l'offre Core : l'org E2E est sur l'offre par défaut, et
            # le test « checkout non configuré » exige qu'elle n'ait pas de prix.
            echo "STRIPE_PRICE_ID_ENGAGEMENT=price_e2e_engagement"
            # Resend : le SDK honore RESEND_BASE_URL → stub local ; le
            # chemin d'envoi RÉUSSI de la newsletter devient testable.
            echo "RESEND_API_KEY=re_test_$(openssl rand -hex 12)"
            echo "RESEND_FROM_EMAIL=Lastchance E2E <e2e@test.local>"
            echo "RESEND_BASE_URL=http://127.0.0.1:12112"
          } >> "$GITHUB_ENV"

      # PAS de cache `.next/cache` ici, et c'est MESURÉ — pas une omission.
      # Posé le 2026-08-05 (#107) avec `restore-keys` par préfixe, retiré le même
      # jour (#109) : DEUX runs, aucun gain. Build à 64 s puis 61 s, contre 60 s
      # sans lui — du bruit, et dans le mauvais sens. L'étape de restauration
      # elle-même ne rendait qu'une seconde, signe qu'il n'y avait presque rien à
      # restaurer. Le cache des NAVIGATEURS Playwright, posé au même moment, tient
      # lui ses 66 s (97 s → 31 s) : l'écart entre les deux est toute la raison de
      # garder l'un et pas l'autre. Ne pas le reposer sans mesure nouvelle — un
      # cache qui n'accélère rien est du config mort, et le config mort se paie en
      # confiance accordée à une garde qui ne garde rien.
      - name: Build de production
        run: npm run build

      - name: Démarrer l'app (+ proxy TLS pour les cookies Secure)
        run: |
          # Stubs d'API externes (Stripe :12111, Resend :12112).
          node e2e/api-stubs.mjs &
          npx wait-on -t 15000 tcp:12111 tcp:12112
          npm run start &
          npx wait-on -t 60000 tcp:3000
          # WebKit refuse les cookies Secure sur http://localhost : les
          # tests passent par ce proxy HTTPS auto-signé.
          npx local-ssl-proxy --source 3443 --target 3000 &
          npx wait-on -t 30000 tcp:3443
          echo "E2E_BASE_URL=https://localhost:3443" >> "$GITHUB_ENV"
          echo "— /api/health (diagnostic non bloquant) —"
          # Le Bearer est indispensable depuis SEC-3 : sans lui la route ne rend
          # que le verdict, et ce diagnostic existe précisément pour connaître la
          # CAUSE d'un 503 (cf. le commentaire TURNSTILE_REQUIRED plus haut). Le
          # secret est tiré au hasard à chaque run et ne vaut que contre ce
          # localhost.
          curl -s -H "Authorization: Bearer $CRON_SECRET" \
            http://localhost:3000/api/health || true
          echo

      # Diagnostic : si les pages publiques n'affichent pas le jeu, le
      # message d'erreur exact apparaît ici (chaîne QR→campagne→roue ou
      # client service role) — évite de déboguer à l'aveugle via Playwright.
      - name: Diagnostic pages publiques (non bloquant)
        run: |
          echo "— PostgREST direct (embed loadPlayContext) —"
          eval "$(supabase status -o env | grep -E '^(SERVICE_ROLE_KEY)=')"
          curl -s "http://127.0.0.1:54321/rest/v1/qr_codes?slug=eq.E2EWIN01&select=id,campaigns!qr_codes_campaign_id_fkey(status,wheels!wheels_campaign_id_fkey(id,prizes!prizes_wheel_id_fkey(id)))" \
            -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY" | head -c 600 || true
          echo
          for p in play/E2EWIN01 play/E2EPAUSE pronos/E2EPRONO; do
            echo "— /$p —"
            curl -s "http://localhost:3000/$p" | grep -oE "(Ce lien de jeu n'existe pas|momentanément désactivé|pas active|pas encore commencé|est terminée|Oups[^<]*|Une erreur[^<]*|Tournez la roue|Je participe|Championnat introuvable)" | sort -u | head -5 || true
          done

      # Les binaires des navigateurs ne changent qu'avec la version de
      # Playwright, elle-même figée par le lockfile — d'où cette clé. Mesuré le
      # 2026-08-05 : cette étape prenait 97 s à chaque run, sur un job dont
      # 64 % du temps était déjà de la mise en place et 36 % seulement du test.
      - name: Cache des navigateurs Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # DEUX BRANCHES, ET LA SECONDE N'EST PAS FACULTATIVE. `--with-deps` pose
      # aussi des paquets SYSTÈME (apt) qui ne vivent PAS dans
      # `~/.cache/ms-playwright` : un cache touché restaure les binaires mais
      # pas les bibliothèques dont WebKit a besoin. Sans la seconde branche, le
      # premier cache touché ferait échouer le job au LANCEMENT du navigateur —
      # pas au test, donc avec un message qui ne désignerait pas la cause.
      - name: Navigateurs Playwright (binaires + dépendances système)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Dépendances système seules (binaires déjà en cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Tests E2E
        id: e2e
        run: npx playwright test

      # `trace: "retain-on-failure"` (playwright.config.ts) produit déjà une
      # trace complète — captures, DOM, réseau, journal des appels — pour
      # chaque test tombé. Sans cette publication elle mourait avec
      # l'exécutant, ne laissant qu'un « element(s) not found » dans le
      # journal : de quoi constater un échec, jamais de quoi le comprendre.
      # Trois passages ont ainsi été dépensés à deviner ce qu'une trace dit
      # d'un coup d'œil. Même raison que l'artefact des types plus haut.
      - name: Traces Playwright des tests en échec
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-report.json
          if-no-files-found: warn
          retention-days: 7

      # Une suite entièrement ignorée passerait en silence : on exige
      # qu'au moins un test se soit réellement exécuté.
      - name: Aucun test exécuté = échec
        if: always()
        run: |
          if [ ! -f playwright-report.json ]; then
            echo "Pas de rapport Playwright (étape précédente en échec) — rien à vérifier ici."
            exit 0
          fi
          executed=$(node -e "const r=require('./playwright-report.json');console.log(r.stats.expected + r.stats.unexpected + r.stats.flaky)")
          echo "Tests exécutés : $executed"
          if [ "$executed" -eq 0 ]; then
            echo "::error::Aucun test E2E ne s'est exécuté (tous ignorés ?)"
            exit 1
          fi

  codeql:
    name: CodeQL · JavaScript / TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # PAS de `npm run build` : JS/TS n'est pas compilé, CodeQL extrait et
      # analyse la SOURCE directement (mode no-build, défaut GitHub pour ce
      # langage). Le build ne changeait rien à la couverture des requêtes
      # security-extended — il coûtait ~60-90 s pour rien. `npm ci` est conservé :
      # node_modules présent aide CodeQL à résoudre les imports.
      - run: npm ci
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
