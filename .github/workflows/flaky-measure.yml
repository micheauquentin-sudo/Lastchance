# Mesure du taux d'échec réel d'un spec E2E intermittent.
#
# POURQUOI UN JOB DÉDIÉ, ET PAS UNE MESURE LOCALE :
# la machine de développement dispose de 7,9 Gio au total, dont WSL reçoit la
# moitié. Un build Next.js de production, neuf conteneurs Supabase et Chromium
# n'y tiennent pas : le service WSL est tombé cinq fois de suite, emportant
# chaque fois la mesure sans écrire un seul essai. Ce n'est pas un problème de
# code, c'est un plafond matériel — la mesure appartient donc au runner.
#
# POURQUOI UNE MESURE RÉPÉTÉE, ET PAS « on relance pour voir » :
# à ~15 % d'échec, six passages verts ont plus d'une chance sur trois d'être
# fortuits. Vingt essais ramènent ce risque à ~4 %, trente à ~0,8 %. Un nombre
# d'essais qui n'est pas calibré sur le taux observé ne prouve rien.
#
# GARDE-FOU DU HARNAIS, en DEUX temps — parce qu'un harnais cassé ment dans les
# deux sens, et que celui-ci a menti dans les deux :
#
#   1. chaque essai REMET LA BASE À ZÉRO puis sème, et vérifie que la saison
#      semée est bien ACTIVE. Première version : 19 rouges sur 20, tous
#      artefacts d'un re-seed qui ne rouvrait pas la saison close — le seed la
#      réinsère en `on conflict (id) do nothing`, ce qui ne restaure pas une
#      ligne mutée ;
#   2. l'AUTHENTIFICATION est préchauffée : le reset recrée la base sous les
#      pieds de GoTrue. Deuxième version : 6 rouges sur 20, et les SIX à la
#      connexion — convalescence de l'infrastructure attribuée au produit.
#
# Un essai qui échoue l'une de ces gardes n'est PAS compté. Mieux vaut moins
# d'essais qu'une mesure qui décrit autre chose que ce qu'on croit mesurer.
#
# Déclenchement manuel uniquement : `gh workflow run flaky-measure.yml`.

name: Mesure d'un test intermittent

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Spec à mesurer"
        required: true
        default: "e2e/progression.spec.ts"
      projet:
        description: "Projet Playwright"
        required: true
        default: "mobile-chrome"
      essais:
        description: "Nombre d'essais (calibrer sur le taux attendu)"
        required: true
        default: "20"

jobs:
  mesure:
    name: Taux d'échec réel
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installation reproductible (lockfile)
        run: npm ci

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Démarrer Supabase (migrations appliquées)
        run: supabase start

      - name: Seed initial
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/seed.sql

      - name: Environnement de l'app
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
            echo "SPIN_TOKEN_SECRET=$(openssl rand -hex 32)"
            echo "CLAIM_TOKEN_SECRET=$(openssl rand -hex 32)"
            echo "PLAYER_KEY_SALT=$(openssl rand -hex 32)"
            echo "UNSUBSCRIBE_TOKEN_SECRET=$(openssl rand -hex 32)"
            echo "TEAM_INVITE_TOKEN_SECRET=$(openssl rand -hex 32)"
            echo "CRON_SECRET=$(openssl rand -hex 16)"
            echo "TURNSTILE_REQUIRED=false"
            echo "STRIPE_SECRET_KEY=sk_test_$(openssl rand -hex 12)"
            echo "STRIPE_WEBHOOK_SECRET=whsec_$(openssl rand -hex 24)"
            echo "STRIPE_API_BASE=http://127.0.0.1:12111"
            echo "STRIPE_PRICE_ID_ENGAGEMENT=price_e2e_engagement"
            echo "RESEND_API_KEY=re_test_$(openssl rand -hex 12)"
            echo "RESEND_FROM_EMAIL=Lastchance E2E <e2e@test.local>"
            echo "RESEND_BASE_URL=http://127.0.0.1:12112"
          } >> "$GITHUB_ENV"

      # LES DEUX navigateurs, quel que soit le projet demandé. Le harnais
      # n'installait que chromium — celui de son projet PAR DÉFAUT. Une mesure
      # lancée sur `mobile-safari` le 2026-07-30 a rendu 22 rouges sur 22, tous
      # « Executable doesn't exist ». Elle aurait fait conclure à un défaut
      # systématique du produit ; elle ne disait que « navigateur absent ».
      - name: Navigateurs Playwright
        run: npx playwright install --with-deps chromium webkit

      # GARDE — le capteur doit exister avant qu'on mesure quoi que ce soit.
      #
      # Les deux gardes existantes couvrent la BASE (saison semée active) et
      # l'AUTHENTIFICATION (jeton obtenu de GoTrue). Il en manquait une sur le
      # navigateur lui-même — et c'est précisément par là que le harnais a menti.
      #
      # Elle échoue le JOB au lieu d'écarter des essais : un navigateur absent
      # ne se répare pas d'un essai à l'autre, et trente essais non comptés ne
      # valent pas mieux qu'un message clair tout de suite.
      - name: Le navigateur du projet demandé démarre
        env:
          PROJET: ${{ inputs.projet }}
        run: |
          node -e "
          const pw = require('playwright');
          const type = process.env.PROJET.includes('safari') ? pw.webkit : pw.chromium;
          type.launch()
            .then((b) => b.close())
            .then(() => console.log('navigateur disponible pour ' + process.env.PROJET))
            .catch((e) => { console.error('NAVIGATEUR INDISPONIBLE (' + process.env.PROJET + ') : ' + e.message); process.exit(1); });
          "

      - name: Build de production
        run: npm run build

      - name: Démarrer l'app (+ proxy TLS)
        run: |
          node e2e/api-stubs.mjs &
          npx wait-on -t 15000 tcp:12111 tcp:12112
          npm run start &
          npx wait-on -t 60000 tcp:3000
          npx local-ssl-proxy --source 3443 --target 3000 &
          npx wait-on -t 30000 tcp:3443
          echo "E2E_BASE_URL=https://localhost:3443" >> "$GITHUB_ENV"

      - name: Mesure
        env:
          SPEC: ${{ inputs.spec }}
          PROJET: ${{ inputs.projet }}
          ESSAIS: ${{ inputs.essais }}
          PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          verts=0; rouges=0; sautes=0; echecs=""

          # Identité de la saison semée (supabase/seed.sql) : le spec la CLÔT,
          # et `on conflict (id) do nothing` fait que la reposer ne la
          # rouvre PAS. Rejouer le seed seul ne réarme donc rien.
          SAISON=e2f00000-0000-4000-8000-000000000001

          for n in $(seq 1 "$ESSAIS"); do
            # Réarmement RÉEL : remise à zéro du schéma puis seed. Plus lent
            # qu'un simple re-seed, mais c'est le seul qui restaure un état
            # muté — première version de ce job : 19 rouges sur 20, tous
            # artefacts d'une saison restée close depuis l'essai 1.
            # `|| var=$?` et non `; var=$?` : GitHub exécute les `run:` avec
            # `bash -e`. Écrit sur deux lignes, un `supabase db reset` en échec
            # TUAIT L'ÉTAPE avant même que `reset_rc` soit lu — la garde
            # « essai non compté » juste en dessous était donc DU CODE MORT
            # depuis la création de ce job. Constaté le 2026-07-30 : une mesure
            # s'est arrêtée au 5e essai sur `Process completed with exit code 1`,
            # sans une ligne d'explication, là où la garde aurait dû écarter
            # l'essai et continuer. Un harnais qui meurt en silence est pire
            # qu'un harnais qui compte mal : on ne sait même pas qu'il a menti.
            reset_rc=0
            supabase db reset --no-seed > /tmp/reset.log 2>&1 || reset_rc=$?
            seed_rc=0
            psql "$PGURL" -q -v ON_ERROR_STOP=1 -f supabase/seed.sql > /tmp/seed.log 2>&1 || seed_rc=$?

            # CONTRÔLE DU HARNAIS : la saison semée doit exister ET être
            # ACTIVE. « au moins une saison » ne suffit pas — c'est
            # exactement la garde trop faible qui a laissé passer 19 faux
            # rouges. Un essai non réarmé n'exerce rien et n'est jamais
            # compté vert.
            etat=$(psql "$PGURL" -tAc "select status from public.progression_seasons where id = '$SAISON';" 2>/dev/null | tr -d ' ')

            if [ "$reset_rc" != "0" ] || [ "$seed_rc" != "0" ] || [ "$etat" != "active" ]; then
              sautes=$((sautes+1))
              echo "essai $n : NON COMPTÉ (reset rc=$reset_rc, seed rc=$seed_rc, saison=${etat:-absente})"
              tail -3 /tmp/reset.log || true
              head -3 /tmp/seed.log || true
              continue
            fi
            saisons="$etat"

            # ── PRÉCHAUFFAGE DE L'AUTHENTIFICATION ────────────────────
            # `supabase db reset` recrée la base sous les pieds de GoTrue, qui
            # conserve des connexions devenues invalides. Une connexion jouée
            # trop tôt échoue alors pour une raison qui n'a RIEN à voir avec le
            # parcours mesuré. Ce n'est pas une hypothèse : le passage
            # précédent a rendu 6 rouges sur 20 et les SIX portaient la même
            # erreur — `expect(page).toHaveURL(/dashboard/)`, page restée sur
            # /login. L'échec était à la connexion, pas dans la progression.
            #
            # On demande donc un jeton directement à GoTrue avant de compter
            # l'essai. Sans cette garde, on mesure la convalescence de
            # l'infrastructure et on l'attribue au produit — exactement le
            # genre de conclusion fausse que ce harnais existe pour empêcher.
            eval "$(supabase status -o env | grep -E '^ANON_KEY=')"
            auth_ok=0
            for w in $(seq 1 30); do
              code=$(curl -s -o /tmp/auth.json -w '%{http_code}' \
                -X POST "http://127.0.0.1:54321/auth/v1/token?grant_type=password" \
                -H "apikey: $ANON_KEY" -H "Content-Type: application/json" \
                -d '{"email":"owner@e2e.local","password":"Password123!"}')
              if [ "$code" = "200" ]; then auth_ok=1; break; fi
              sleep 2
            done

            if [ "$auth_ok" != "1" ]; then
              sautes=$((sautes+1))
              echo "essai $n : NON COMPTÉ (authentification indisponible après 60 s — HTTP $code)"
              head -c 200 /tmp/auth.json || true
              echo
              continue
            fi

            if npx playwright test "$SPEC" --project="$PROJET" --reporter=line > /tmp/e2e.log 2>&1; then
              verts=$((verts+1))
              echo "essai $n : VERT   (saison semee : $saisons)"
            else
              rouges=$((rouges+1)); echecs="$echecs $n"
              echo "essai $n : ROUGE  (saison semee : $saisons)"
              grep -aE "Error:|expect|✘|Timed out" /tmp/e2e.log | head -4 | sed 's/^/     /'
            fi
          done

          comptes=$((verts+rouges))
          {
            echo "## Mesure de \`$SPEC\` — projet \`$PROJET\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| essais comptés | $comptes |"
            echo "| verts | $verts |"
            echo "| rouges | $rouges |"
            echo "| non comptés (réarmement KO) | $sautes |"
            echo
            if [ "$rouges" -gt 0 ]; then
              echo "**Défaut REPRODUIT** — taux observé : $((rouges * 100 / comptes)) % (essais$echecs)"
            elif [ "$comptes" -gt 0 ]; then
              echo "**Aucun échec sur $comptes essais comptés.** Si le taux antérieur"
              echo "était ~15 %, la probabilité que ce soit fortuit vaut 0,85^$comptes."
              echo "À 20 essais : ~4 %."
            else
              echo "**Aucun essai exploitable — la mesure n'établit RIEN.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "comptés=$comptes verts=$verts rouges=$rouges non_comptés=$sautes"
          # Le job ne DOIT PAS échouer quand le défaut est reproduit : son rôle
          # est de mesurer, pas de garder. Il n'échoue que si rien n'a pu être
          # mesuré — auquel cas le résultat serait une illusion.
          test "$comptes" -gt 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traces-mesure
          path: |
            test-results/
            playwright-report/
          retention-days: 3
